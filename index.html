<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Learning Hub</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 60px 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.4rem;
      color: var(--text-main);
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto;
    }

    /* Search Bar Styling */
    .search-box {
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 14px;
      outline: none;
      background-color: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    /* Category Filter Pills */
    .categories-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 35px;
      justify-content: center;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .filter-btn.active {
      background-color: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    /* Lessons Grid */
    .lessons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 22px;
    }

    .lesson-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lesson-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-color);
    }

    /* Harmonized & Accessible Badges */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin-bottom: 12px;
      align-self: flex-start;
    }

    .badge-sports {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .badge-politics {
      background-color: #ffedd5;
      color: #c2410c;
    }

    .badge-grammar {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    .badge-fluency {
      background-color: #fef3c7;
      color: #b45309;
    }

    .badge-listening {
      background-color: #fce7f3;
      color: #be185d;
    }

    .badge-daily {
      background-color: #dcfce7;
      color: #15803d;
    }

    .badge-acquisition {
      background-color: #e0e7ff;
      color: #4338ca;
    }

    .badge-tech {
      background-color: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }

    .badge-science {
      background-color: #f3e8ff;
      color: #6b21a8;
    }

    .badge-students {
      background-color: #fae8ff;
      color: #86198f;
    }

    .lesson-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
      line-height: 1.35;
    }

    .lesson-description {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 20px;
      flex-grow: 1;
      line-height: 1.5;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary-color);
    }

    .arrow-icon {
      transition: transform 0.2s ease;
    }

    .lesson-card:hover .arrow-icon {
      transform: translateX(4px);
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
      font-size: 1.05rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>English Learning Hub</h1>
    <p>Type a title or keyword below to find your review lesson.</p>
  </header>

  <!-- Dynamic Search Input -->
  <div class="search-box">
    <input 
      type="text" 
      id="search-input" 
      class="search-input" 
      placeholder="Enter the title of the lesson you want to review..." 
      autocomplete="off"
    >
  </div>

  <!-- Optional Category Filters -->
  <div class="categories-filter" id="categories-filter">
    <button class="filter-btn" data-category="High Tech">High Tech</button>
    <button class="filter-btn" data-category="Sports & Analysis">Sports</button>
    <button class="filter-btn" data-category="Science">Science</button>
    <button class="filter-btn" data-category="Fluency">Fluency</button>
    <button class="filter-btn" data-category="Listening">Listening</button>
    <button class="filter-btn" data-category="Grammar">Grammar</button>
  </div>

  <!-- Container for Dynamic Lesson Cards -->
  <main class="lessons-grid" id="lessons-grid"></main>

  <!-- Empty state message -->
  <div id="no-results" class="no-results">
    No lessons found matching your keyword.
  </div>
</div>

<script>

    {

      badgeText: "Sports & Analysis",
      badgeClass: "badge-sports",

      url: "haaland.html"
    },
    {
      title: "Why the Political Spectrum is Useless",
      badgeText: "Politics & Logic",

    {

      badgeClass: "badge-grammar",

      title: "I Speak English at Native Speed",

      url: "what-if-ai-was-not-invented.html"

    {
      title: "The Secretary Problem Visually Explained",

    {

      url: "statistician.html"
    },
    {
      title: "Why study statistics?",
      badgeText: "Science",
      badgeClass: "badge-science",

      url: "why-stats.html"
    },
    {
      title: "16 Emergency Medicine Subspecialties Explained",
      badgeText: "Science",
      badgeClass: "badge-science",
      description: "Medical jargon, clinical specializations, and healthcare vocabulary explained simply. Includes 20 quiz questions.",
      url: "emergency-doctor-specialities.html"
    },
    {
      title: "How Top 1% Students Actually Study (Harvard, MIT, Stanford)",
      badgeText: "Study & Mindset",
      badgeClass: "badge-students",
      description: "Active recall, spaced repetition, and cognitive study techniques used at top universities.",
      url: "top-students.html"
    },
    {
      title: "Your Picture of AI Is Out of Date",
      badgeText: "High Tech",
      badgeClass: "badge-tech",
      description: "Analysis of rapid AI evolution, multimodal models, and autonomous agents. Includes 20 interactive quiz questions.",
      url: "picture-of-ai.html"
    },
    {
      title: "How Hough Transforms Teach Computers to See",
      badgeText: "High Tech",
      badgeClass: "badge-tech",
      description: "Computer vision fundamentals, parameter space mapping, and voting accumulators. Includes 20 interactive quiz questions.",
      url: "hough-transform.html"
    },
    {
      title: "Why Video Game Piracy Is Getting Out Of Control",
      badgeText: "High Tech",
      badgeClass: "badge-tech",
      description: "Documentary breakdown on digital ownership, DRM failures, and consumer service problems in gaming.",
      url: "gtavi.html"
    }
  ];

  const searchInput = document.getElementById('search-input');
  const lessonsGrid = document.getElementById('lessons-grid');
  const noResults = document.getElementById('no-results');
  const filterBtns = document.querySelectorAll('.filter-btn');

  let selectedCategory = null;

  function filterLessons() {
    lessonsGrid.innerHTML = '';
    const cleanQuery = searchInput.value.toLowerCase().trim();

    // Google Search logic: If search is completely empty AND no category pill is clicked, show NOTHING
    if (cleanQuery === '' && !selectedCategory) {
      noResults.style.display = 'none';
      return;
    }

    const filteredLessons = lessons.filter(lesson => {
      const matchesSearch = cleanQuery === '' || 
        lesson.title.toLowerCase().includes(cleanQuery) || 
        lesson.description.toLowerCase().includes(cleanQuery) ||
        lesson.badgeText.toLowerCase().includes(cleanQuery);

      const matchesCategory = !selectedCategory || 
        lesson.badgeText.toLowerCase().includes(selectedCategory.toLowerCase());

      return matchesSearch && matchesCategory;
    });

    if (filteredLessons.length === 0) {
      noResults.style.display = 'block';
    } else {
      noResults.style.display = 'none';
      filteredLessons.forEach(lesson => {
        const card = document.createElement('a');
        card.href = lesson.url;
        card.className = 'lesson-card';

        card.innerHTML = `
          <div>
            <span class="badge ${lesson.badgeClass}">${lesson.badgeText}</span>
            <h2 class="lesson-title">${lesson.title}</h2>
            <p class="lesson-description">${lesson.description}</p>
          </div>
          <div class="card-footer">
            <span>Start Lesson</span>
            <span class="arrow-icon">&rarr;</span>
          </div>
        `;
        lessonsGrid.appendChild(card);
      });
    }
  }

  // Handle Category Filter Buttons
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const category = btn.getAttribute('data-category');
      
      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        selectedCategory = null;
      } else {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCategory = category;
      }
      
      filterLessons();
    });
  });

  // Event listener for active typing
  searchInput.addEventListener('input', filterLessons);
</script>

</body>
</html>
