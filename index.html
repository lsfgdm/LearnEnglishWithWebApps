<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Learning Hub</title>
  <!-- Telegram WebApp SDK for seamless integration -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 60px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--text-main);
      margin-bottom: 12px;
      font-weight: 800;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Search Bar Styling */
    .search-box {
      margin-bottom: 35px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.15rem;
      border: 2px solid var(--border);
      border-radius: 14px;
      outline: none;
      background-color: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    /* Lessons Grid */
    .lessons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }

    .lesson-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 28px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lesson-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-color);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
      align-self: flex-start;
    }

    .badge-grammar {
      background-color: #dbeafe;
      color: #1e40af;
    }

    .badge-listening {
      background-color: #fce7f3;
      color: #9d174d;
    }

    .lesson-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .lesson-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 15px;
      font-weight: 600;
      color: var(--primary-color);
    }

    .arrow-icon {
      transition: transform 0.2s ease;
    }

    .lesson-card:hover .arrow-icon {
      transform: translateX(5px);
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 0;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>English Learning Hub</h1>
    <p>Type a title or keyword below to find your review lesson.</p>
  </header>

  <!-- Dynamic Search Input -->
  <div class="search-box">
    <input 
      type="text" 
      id="search-input" 
      class="search-input" 
      placeholder="Enter the title of the lesson you want to review..." 
      autocomplete="off"
    >
  </div>

  <!-- Container for Dynamic Lesson Cards -->
  <main class="lessons-grid" id="lessons-grid"></main>

  <!-- Empty state message -->
  <div id="no-results" class="no-results">
    No lessons found matching your keyword.
  </div>
</div>

<script>
  // Initialize Telegram WebApp SDK if available
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // Database of available lessons
  const lessons = [
    {
      title: "Mastering Light Verbs",
      badgeText: "Grammar & Structure",
      badgeClass: "badge-grammar",
      description: "Learn how native speakers use common verbs like make, take, do, have, and give with nouns to sound more natural and fluid.",
      url: "light-verbs.html"
    },
    {
      title: "I Speak English at Native Speed",
      badgeText: "Listening & Native Speed",
      badgeClass: "badge-listening",
      description: "Practice your listening comprehension with Evie's video. Includes a 20-question quiz and key British English expressions.",
      url: "evie-lesson.html"
    },
    {
      title: "This is the *Only* Method to Become Fluent",
      badgeText: "Fluency & Method",
      badgeClass: "badge-fluency",
      description: "Acquire vocabulary first.",
      url: "cat-lesson.html"
    },
    {
      title: "Learn How to Think In English ( Stop Translating in Your Head )",
      badgeText: "Daily & Easy",
      badgeClass: "badge-daily",
      description: "5 Concrete Exercises you can put in practice daily.",
      url: "english-class.html"
    }

  ];

  const searchInput = document.getElementById('search-input');
  const lessonsGrid = document.getElementById('lessons-grid');
  const noResults = document.getElementById('no-results');

  function filterLessons(query) {
    lessonsGrid.innerHTML = '';
    const cleanQuery = query.toLowerCase().trim();

    // If search box is empty, clear results completely
    if (cleanQuery === '') {
      noResults.style.display = 'none';
      return;
    }

    const filteredLessons = lessons.filter(lesson => 
      lesson.title.toLowerCase().includes(cleanQuery) || 
      lesson.description.toLowerCase().includes(cleanQuery) ||
      lesson.badgeText.toLowerCase().includes(cleanQuery)
    );

    if (filteredLessons.length === 0) {
      noResults.style.display = 'block';
    } else {
      noResults.style.display = 'none';
      filteredLessons.forEach(lesson => {
        const card = document.createElement('a');
        card.href = lesson.url;
        card.className = 'lesson-card';

        card.innerHTML = `
          <div>
            <span class="badge ${lesson.badgeClass}">${lesson.badgeText}</span>
            <h2 class="lesson-title">${lesson.title}</h2>
            <p class="lesson-description">${lesson.description}</p>
          </div>
          <div class="card-footer">
            <span>Start Lesson</span>
            <span class="arrow-icon">&rarr;</span>
          </div>
        `;
        lessonsGrid.appendChild(card);
      });
    }
  }

  // Event listener for active typing
  searchInput.addEventListener('input', (e) => {
    filterLessons(e.target.value);
  });
</script>

</body>
</html>
