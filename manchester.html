// Function to render Quiz
function renderQuiz() {
    const quizContainer = document.getElementById('quiz-container');
    let currentCategory = "";

    quizData.forEach((q) => {
        if (q.category !== currentCategory) {
            currentCategory = q.category;
            const catHeader = document.createElement('h3');
            catHeader.textContent = currentCategory;
            quizContainer.appendChild(catHeader);
        }

        const card = document.createElement('div');
        card.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.textContent = q.question;
        card.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        const feedback = document.createElement('div');
        feedback.className = 'feedback';

        q.options.forEach((opt, optIdx) => {
            const li = document.createElement('li');
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;

            btn.onclick = () => {
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);

                if (optIdx === q.answer) {
                    btn.classList.add('correct');
                    feedback.textContent = `Correct! ${q.explanation}`;
                    feedback.classList.add('visible', 'correct-bg');
                } else {
                    btn.classList.add('wrong');
                    allBtns[q.answer].classList.add('correct');
                    feedback.textContent = `Incorrect. ${q.explanation}`;
                    feedback.classList.add('visible', 'wrong-bg');
                }
            };

            li.appendChild(btn);
            optionsList.appendChild(li);
        });

        card.appendChild(optionsList);
        card.appendChild(feedback);
        quizContainer.appendChild(card);
    });
}

// Function to render Expressions
function renderExpressions() {
    const container = document.getElementById('expressions-container');
    expressionsData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'expression-card';

        card.innerHTML = `
            <img class="expression-img" src="${item.image}" alt="${item.term}">
            <div class="expression-body">
                <div class="expression-term">${item.term}</div>
                <div class="expression-trans">🇫🇷 ${item.translation}</div>
                <div class="expression-example"><strong>Example:</strong> "${item.example}"</div>
            </div>
        `;
        container.appendChild(card);
    });
}
